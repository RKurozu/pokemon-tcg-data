# Keeps this fork in step with upstream.
#
# Merge, not fast-forward: this workflow file itself makes the fork diverge
# from upstream by one commit, so ff-only would fail forever. A conflict is
# only possible if upstream ever adds a file at this exact path.
name: sync-upstream

on:
  schedule:
    - cron: "0 5 * * 1"          # Mondays 05:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/PokemonTCG/pokemon-tcg-data.git
          git fetch upstream
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          git merge --no-edit "upstream/$BRANCH" || {
            echo "::error::Upstream merge conflicted — sync this fork by hand."
            exit 1
          }
          git push origin "$BRANCH"
